<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo+Black&amp;family=Bebas+Neue&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&amp;family=Permanent+Marker&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E7E1D8}
/* the iPhone */
.ios{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#000;letter-spacing:-0.01em}
.ios button{font-family:inherit;letter-spacing:inherit}
.ios .tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ios .tap{transition:opacity .25s cubic-bezier(.2,.8,.25,1)}
.ios .tap:active{opacity:.82;transition-duration:.08s}
.ios input{font-family:inherit}
.ios ::-webkit-scrollbar{display:none}
/* our own UI: fonts and colours come from the theme variables on the UI layer; the layer itself lets taps through to the 3D */
.ios .cu{font-family:var(--f-text);letter-spacing:var(--t-track);font-weight:var(--t-w);pointer-events:none}
.ios .cu>*{pointer-events:auto}
.ios .cu button{font-family:inherit}
.ios .cu .sys,.ios .cu .sys button{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-0.01em}
/* rough edges, per kind of box: the border, fill and shadow move to a filtered layer behind the content */
.cu.rough.rk-drawer .rb.k-drawer,.cu.rough.rk-card .rb.k-card,.cu.rough.rk-button .rb.k-button,.cu.rough.rk-field .rb.k-field,.cu.rough.rk-control .rb.k-control{border-color:transparent !important;background:transparent !important;box-shadow:none !important;overflow:visible !important;isolation:isolate}
.cu.rough.rk-drawer .rb.k-drawer:not([style*="position: absolute"]),.cu.rough.rk-card .rb.k-card:not([style*="position: absolute"]),.cu.rough.rk-button .rb.k-button:not([style*="position: absolute"]),.cu.rough.rk-field .rb.k-field:not([style*="position: absolute"]),.cu.rough.rk-control .rb.k-control:not([style*="position: absolute"]){position:relative}
.cu.rough.rk-drawer .rb.k-drawer::before,.cu.rough.rk-card .rb.k-card::before,.cu.rough.rk-button .rb.k-button::before,.cu.rough.rk-field .rb.k-field::before,.cu.rough.rk-control .rb.k-control::before{content:'';position:absolute;inset:calc(-1 * var(--rb-bw, 0px));border-radius:inherit;background:var(--rb-bg, transparent);border:var(--rb-bd);border-bottom:var(--rb-bdb, var(--rb-bd));box-shadow:var(--rb-sh, none);filter:url(#cu-rough);z-index:-1;pointer-events:none;box-sizing:border-box}
@keyframes is-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes is-pulse{0%{opacity:.35}50%{opacity:.9}100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.ios *{transition:none !important;animation:none !important}}
</style>
</head><body>
<template id="t">
<div ref="{{ setOuter }}" style="position: relative; width: 100%; height: 100vh; min-height: 640px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #E7E1D8">
<div ref="{{ setPhone }}" role="application" aria-label="pl8(math) prototype: the app, from opening to the end of a session" style="position: relative; flex: none; width: 390px; height: 844px; overflow: hidden; background: {{ palBg }}; border-radius: {{ radius }}; box-shadow: {{ shadow }}; transform: scale({{ scale }}); transform-origin: center center"></div>
</div>
</template><div id="root"></div>
<script>window.__errs=[];window.addEventListener('error',e=>window.__errs.push(String(e.message)));
class DCLogic{constructor(p){this.props=p||{}} setState(o){Object.assign(this.state,o);Promise.resolve().then(render)}}</script>
<script src="platekit.js"></script>
<script src="fl.js"></script>
<script>
const c=new Component({});window.c=c;
function get(ctx,p){return p.split('.').reduce((o,k)=>o==null?o:o[k],ctx)}
function fill(str,ctx){return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const v=get(ctx,p);return typeof v==='function'?'':v})}
function walk(node,ctx,out){
  for(const n of [...node.childNodes]){
    if(n.nodeType===3){out.appendChild(document.createTextNode(fill(n.textContent,ctx)));continue}
    if(n.nodeType!==1)continue;
    const tag=n.tagName.toLowerCase();
    if(tag==='sc-if'){const v=get(ctx,n.getAttribute('value').replace(/[{} ]/g,''));if(v)walk(n,ctx,out);continue}
    if(tag==='sc-for'){const l=get(ctx,n.getAttribute('list').replace(/[{} ]/g,''))||[];const as=n.getAttribute('as');l.forEach(it=>walk(n,Object.assign({},ctx,{[as]:it}),out));continue}
    const e=document.createElement(tag);
    for(const at of n.attributes){const m=at.value.match(/^\{\{\s*([\w.]+)\s*\}\}$/);
      if(at.name.toLowerCase()==='onclick'&&m){const f=get(ctx,m[1]);e.addEventListener('click',()=>f&&f());continue}
      if(at.name.toLowerCase()==='ref'&&m){const f=get(ctx,m[1]);f&&f(e);e.__ref=true;continue}
      if(at.name.toLowerCase()==='onchange'&&m){const f=get(ctx,m[1]);e.addEventListener('input',ev=>f&&f(ev));continue}
      e.setAttribute(at.name,fill(at.value,ctx))}
    if(n.namespaceURI&&tag==='svg'){e.outerHTML;}
    walk(n.content||n,ctx,e);out.appendChild(e)}
}
let stageEl=null;
function render(){const r=document.getElementById('root');
  if(stageEl&&stageEl.parentNode) stageEl.remove();
  r.innerHTML='';const t=document.getElementById('t').content;walk(t,c.renderVals(),r);
  const s=r.querySelector('[role=application]'); if(stageEl){s.replaceWith(stageEl)} else stageEl=s;}
const rs=c.setPhone;c.setPhone=(el)=>{if(!stageEl)rs(el)};
render();
</script></body></html>
