# Checks every push so Will doesn't have to (DECISIONS 2026-10-16):
#   platekit  — PlateKit's tests, then the 3D room compared with the prototype, station by station
#   app       — the app built for the iPhone Simulator, then screenshots of its main screens
#   server    — the read server's tests (App Attest with Apple's real attestations, the endpoints) and typecheck
# Results: the run's summary, the "prototype-check" and "screenshots" artifacts, and (for pull requests) the
# pictures on the ci-screens branch, where Claude's session can fetch them with git.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # a new push waits, so every commit gets its pictures

jobs:
  server:
    name: Read server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  platekit:
    name: PlateKit tests + prototype check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: PlateKit tests
        working-directory: PlateKit
        run: swift test

      - name: Bake the room for the prototype check
        working-directory: PlateKit
        run: PL8_SCENE_DUMP="$GITHUB_WORKSPACE/tools/visual-check/out" swift test --filter SceneDump

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the checker
        working-directory: tools/visual-check
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Compare with the prototype
        working-directory: tools/visual-check
        run: |
          set -o pipefail
          node compare.mjs | tee out/log.txt
          echo "## 3D room vs prototype" >> "$GITHUB_STEP_SUMMARY"
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the side-by-side pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-check
          path: tools/visual-check/out/*.png
          if-no-files-found: ignore

  app:
    name: App build + screenshots
    runs-on: macos-26
    needs: platekit
    if: always()
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for the Simulator
        run: |
          set -o pipefail
          xcodebuild -project pl8/pl8.xcodeproj -scheme pl8 \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          print(devices[-1]['udid'])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/pl8.app
          mkdir -p screens perf
          for shot in opening-title flow-name flow-unit flow-plates flow-plates-ticked flow-bar flow-prs flow-prDial flow-wod flow-kit flow-sets flow-sets-last flow-done flow-menu flow-menu-train flow-menu-prs flow-menu-gym flow-name-locked flow-unit-abduct flow-plates-stroke flow-plates-done flow-kit-down flow-kit-up flow-sets-drag flow-menu-back flow-menu-delete flow-reading flow-menu-add flow-wod-unread flow-prs-unread session-over-drag flow-menu-at-prs flow-menu-at-gym flow-menu-roll; do
            xcrun simctl launch --terminate-running-process "$DEVICE" com.williansertorio.pl8 -pl8Shot "$shot"
            sleep 20
            xcrun simctl io "$DEVICE" screenshot "screens/$shot.png"
            DATA=$(xcrun simctl get_app_container "$DEVICE" com.williansertorio.pl8 data 2>/dev/null || true)
            cp "$DATA/Documents/perf.log" "perf/$shot.txt" 2>/dev/null || true
          done
          echo "$DEVICE" > device.txt

      - name: Data checks
        run: |
          # The saved data must survive the update (docs/DATA-AND-SERVICES.md §1). Two checks:
          DEVICE=$(cat device.txt)
          APP=com.williansertorio.pl8
          mkdir -p data
          # 1. In the app: a store made with the old models (SchemaV1) opens with the new ones, every row and link kept.
          xcrun simctl launch --terminate-running-process "$DEVICE" $APP -pl8MigrationCheck
          sleep 15
          DATA=$(xcrun simctl get_app_container "$DEVICE" $APP data)
          cp "$DATA/Documents/migration-check.txt" data/ || echo "result: no report" > data/migration-check.txt
          # 2. The real update: the build on Will's phone (108bd6e) makes its store, then this build is installed over it.
          git fetch -q --depth=1 origin 108bd6e8ab6cd8d277d64255507b414c837d5584
          git worktree add -q old-build FETCH_HEAD
          xcodebuild -project old-build/pl8/pl8.xcodeproj -scheme pl8 -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-old CODE_SIGNING_ALLOWED=NO build > build-old.log 2>&1 || true
          grep -q "BUILD SUCCEEDED" build-old.log
          xcrun simctl terminate "$DEVICE" $APP || true
          xcrun simctl uninstall "$DEVICE" $APP
          xcrun simctl install "$DEVICE" build-old/Build/Products/Debug-iphonesimulator/pl8.app
          xcrun simctl launch "$DEVICE" $APP
          sleep 20
          xcrun simctl terminate "$DEVICE" $APP || true
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/pl8.app
          xcrun simctl launch "$DEVICE" $APP -pl8DataCheck
          sleep 15
          DATA=$(xcrun simctl get_app_container "$DEVICE" $APP data)
          cp "$DATA/Documents/data-check.txt" data/upgrade-check.txt || echo "result: no report" > data/upgrade-check.txt
          xcrun simctl terminate "$DEVICE" $APP || true
          for f in data/*.txt; do echo "== $f"; cat "$f"; done
          grep -q "^result: ok" data/migration-check.txt
          grep -q "^result: ok" data/upgrade-check.txt
          grep -q "^gyms: [1-9]" data/upgrade-check.txt

      - name: Timing in Release
        continue-on-error: true
        run: |
          # The same moments built optimized (Xcode's Run builds Debug), to see what the optimizer buys.
          set -o pipefail
          xcodebuild -project pl8/pl8.xcodeproj -scheme pl8 -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-release.log
          DEVICE=$(cat device.txt)
          xcrun simctl install "$DEVICE" build-release/Build/Products/Release-iphonesimulator/pl8.app
          for shot in flow-name-locked flow-plates-done flow-bar flow-kit flow-menu flow-menu-gym; do
            xcrun simctl launch --terminate-running-process "$DEVICE" com.williansertorio.pl8 -pl8Shot "$shot"
            sleep 20
            DATA=$(xcrun simctl get_app_container "$DEVICE" com.williansertorio.pl8 data 2>/dev/null || true)
            cp "$DATA/Documents/perf.log" "perf/release-$shot.txt" 2>/dev/null || true
          done

      - name: Keep the screenshots and the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screens/*.png
            build.log
          if-no-files-found: ignore

      - name: Fetch the prototype check's pictures
        if: always() && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: prototype-check
          path: prototype-check
        continue-on-error: true

      - name: Publish the pictures on the ci-screens branch
        if: always() && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p publish/screens publish/prototype-check publish/perf publish/data
          cp screens/*.png publish/screens/ 2>/dev/null || true
          cp data/*.txt publish/data/ 2>/dev/null || true
          cp perf/*.txt publish/perf/ 2>/dev/null || true
          # The prototype's renders are 780 px wide: the same size keeps the push small (a full set timed out).
          for f in publish/screens/*.png; do sips --resampleWidth 780 "$f" >/dev/null 2>&1 || true; done
          cp prototype-check/*.png publish/prototype-check/ 2>/dev/null || true
          cp build.log publish/ 2>/dev/null || true
          echo "$SHA" > publish/SHA
          cd publish
          git init -q
          git checkout -q -b ci-screens
          git add .
          git -c user.name="pl8 CI" -c user.email="ci@users.noreply.github.com" commit -qm "Pictures for $SHA"
          for attempt in 1 2 3; do
            git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens && break
            sleep $((attempt * 10))
          done
